<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الميزانية التلقائية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        h3 {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            color: #374151;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 10px;
        }

        /* تنسيق الجدول */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table td {
            padding: 10px 0;
            vertical-align: middle;
            border-bottom: 1px solid #f0f0f0;
        }

        .data-table input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1.1rem;
            background-color: #f9fafb;
            text-align: left;
            direction: ltr;
            font-family: sans-serif;
            outline: none;
            transition: 0.2s;
        }

        .data-table input:focus {
            border-color: var(--primary);
            background-color: #fff;
        }

        /* الملخص */
        .summary-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            text-align: center;
        }

        .total-balance {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
            color: var(--success);
        }
        .total-balance.negative { color: var(--danger); }

        /* شارة الحفظ التلقائي */
        .auto-save-badge {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .auto-save-badge.show { opacity: 1; }

        /* زر التصدير (اختياري) */
        .export-btn {
            margin-top: 10px;
            background-color: #e5e7eb;
            color: #374151;
            padding: 10px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-family: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- أيقونة توضيحية للحفظ -->
<div id="saveBadge" class="auto-save-badge">تم الحفظ تلقائياً ✓</div>

<div class="container">
    <!-- بطاقة الملخص -->
    <div class="card summary-card">
        <h3>الملخص</h3>
        <div style="font-size: 0.9rem; opacity: 0.8;">المتبقي للشهر</div>
        <div id="displayBalance" class="total-balance">0</div>
    </div>

    <!-- بطاقة الإدخال -->
    <div class="card">
        <h3>التفاصيل</h3>
        <table class="data-table">
            <tbody>
                <tr>
                    <td style="width: 40%;">الراتب</td>
                    <td><input type="number" id="salary" placeholder="0" oninput="handleInput()"></td>
                </tr>
                <tr><td>الإيجار</td><td><input type="number" id="rent" placeholder="0" class="exp" oninput="handleInput()"></td></tr>
                <tr><td>الحلاقة والحمام</td><td><input type="number" id="grooming" placeholder="0" class="exp" oninput="handleInput()"></td></tr>
                <tr><td>النقل</td><td><input type="number" id="transport" placeholder="0" class="exp" oninput="handleInput()"></td></tr>
                <tr><td>المواد الغذائية والخضر</td><td><input type="number" id="food" placeholder="0" class="exp" oninput="handleInput()"></td></tr>
                <tr><td>الدين</td><td><input type="number" id="debt" placeholder="0" class="exp" oninput="handleInput()"></td></tr>
                <tr><td>الكهرباء والغاز</td><td><input type="number" id="utilities" placeholder="0" class="exp" oninput="handleInput()"></td></tr>
                <tr><td>مصاريف الكل</td><td><input type="number" id="general" placeholder="0" class="exp" oninput="handleInput()"></td></tr>
                <tr><td>مصاريف الدراسة</td><td><input type="number" id="education" placeholder="0" class="exp" oninput="handleInput()"></td></tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <button class="export-btn" onclick="exportJson()">تصدير نسخة احتياطية (JSON)</button>
    </div>
</div>

<script>
    // معرفات الحقول
    const fieldIds = ['salary', 'rent', 'grooming', 'transport', 'food', 'debt', 'utilities', 'general', 'education'];

    // 1. عند فتح الصفحة: قم بجلب البيانات تلقائياً من الذاكرة
    window.addEventListener('DOMContentLoaded', () => {
        const savedData = localStorage.getItem('myBudgetApp_v1');
        if (savedData) {
            const data = JSON.parse(savedData);
            // ملء الحقول بالبيانات القديمة
            fieldIds.forEach(id => {
                if (data[id] !== undefined) {
                    document.getElementById(id).value = data[id];
                }
            });
            calculate(); // تحديث الحسابات
        }
    });

    // 2. عند الكتابة: احسب و احفظ تلقائياً
    function handleInput() {
        calculate();
        autoSave();
    }

    // دالة الحساب
    function calculate() {
        const salary = parseFloat(document.getElementById('salary').value) || 0;
        let totalExp = 0;
        fieldIds.forEach(id => {
            if (id !== 'salary') {
                totalExp += parseFloat(document.getElementById(id).value) || 0;
            }
        });

        const balance = salary - totalExp;
        const el = document.getElementById('displayBalance');
        el.innerText = balance.toLocaleString();
        el.className = balance < 0 ? 'total-balance negative' : 'total-balance';
    }

    // دالة الحفظ التلقائي (في الذاكرة الداخلية)
    function autoSave() {
        const data = {};
        fieldIds.forEach(id => {
            data[id] = document.getElementById(id).value;
        });
        
        // حفظ في LocalStorage
        localStorage.setItem('myBudgetApp_v1', JSON.stringify(data));

        // إظهار رسالة "تم الحفظ" لمدة ثانية
        const badge = document.getElementById('saveBadge');
        badge.classList.add('show');
        setTimeout(() => badge.classList.remove('show'), 2000);
    }

    // دالة التصدير (لملف base.json) - اختياري للنسخ الاحتياطي فقط
    function exportJson() {
        const data = {};
        fieldIds.forEach(id => data[id] = document.getElementById(id).value);
        
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "base.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
